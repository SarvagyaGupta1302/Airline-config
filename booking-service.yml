server:
  port: 5008

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yt_airline_booking_db
    username: root
    password: 123456

  kafka:
    bootstrap-servers: localhost:9092   # <-- Correct nesting
    consumer:
      group-id: booking-service-group


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true