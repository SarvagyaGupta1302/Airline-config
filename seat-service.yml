server:
  port: 5005

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yt_airline_seat_db
    username: root
    password: 123456

  kafka:
    bootstrap-servers: localhost:9092   # <-- Correct nesting
    consumer:
      group-id: seat-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.sarvagya.common-lib.event


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true